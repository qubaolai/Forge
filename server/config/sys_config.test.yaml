# ============================================================
# sys_config.test.yaml — 测试环境配置
# 启动: APP_ENV=test pytest  或  pytest (conftest.py 自动注入)
#
# 与 dev/prod 的核心差异:
#   - embedding / reranker 用 mock provider, 不发真实 HTTP 请求
#   - celery / memory 关闭, 不依赖 Redis worker
#   - log_level WARNING, 减少测试输出噪音
#   - 连接池最小化, 加快 fixture 启动
# ============================================================

app:
  log_level: WARNING
  port: 8553
  auth:
    jwt_secret: ${JWT_SECRET:test-jwt-secret-do-not-use-in-prod}
    jwt_algorithm: HS256
    access_token_expire_minutes: 60
    refresh_token_expire_days: 30
    cookie_secure: false
    cookie_samesite: lax

middleware:
  cors:
    allow_origins: http://localhost:3000
    allow_credentials: true

db:
  driver: ${DB_DRIVER:mysql+aiomysql}
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:3306}
  user: ${DB_USER:test}
  password: ${DB_PASSWORD:test}
  database: ${DB_DATABASE:test}
  echo: false
  charset: utf8mb4
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
  pool_pre_ping: false  # aiomysql 0.3.x ping() incompatibility

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD:test}
  database: ${REDIS_DB:1}
  pool_size: 2

# 测试环境关闭 Celery, 所有异步任务降级为 NullTaskQueue (只记日志)
celery:
  enabled: false
  broker_url: ""
  backend_url: ""

user_quota:
  enabled: false
  alert_threshold: 0.8
  five_hour:
    window_seconds: 18000
    limit_usd:
    limit_tokens:
    limit_calls:
  weekly:
    window_seconds: 604800
    limit_usd:
    limit_tokens:
    limit_calls:

# 测试环境关闭记忆系统, 避免触发 Celery 任务
memory:
  enabled: false
  summarizer:
    provider: ""
    model: ""
    history_limit: 10
    max_summary_tokens: 500
  trigger:
    every_n_turns: 999

llm:
  provider: ${LLM_PROVIDER:}
  default_model: ${LLM_DEFAULT_MODEL:}
  max_retries: 1
  retry_backoff_seconds: 0.0
  providers: {}

utility_llm:
  provider: ${UTILITY_LLM_PROVIDER:}
  model: ${UTILITY_LLM_MODEL:}

ingest:
  documents_path: data/documents
  chunking:
    strategy: hierarchical
    chunk_size: 500
    chunk_overlap: 50

vector_store:
  provider: chroma
  providers:
    chroma:
      persist_dir: data/test_chroma
      collection_name: test_chunks

bm25_store:
  provider: sqlite_fts5
  providers:
    sqlite_fts5:
      db_path: data/test_bm25.db
      table_name: bm25_chunks
  tokenizer:
    type: jieba
    user_dict: null

retrieval:
  top_n_parent: 3
  top_m_for_rerank: 10
  recall:
    vector:
      enabled: true
      top_k: 10
    bm25:
      enabled: true
      top_k: 10
  fusion:
    strategy: rrf
    rrf_k: 60
    weighted_vector: 0.7
    weighted_bm25: 0.3
  aggregation:
    score_agg: max
  rerank:
    enabled: false

observability:
  tracing:
    enabled: false
    exporter: none
    service_name: forge-test
    otel_endpoint: ""
    langfuse_public_key: ""
    langfuse_secret_key: ""
    langfuse_host: https://cloud.langfuse.com

# 测试环境 agent_profiles: 仅 chat profile 用于回归.
agent_profiles:
  model_profiles:
    fast: ${FAST_MODEL:dashscope:qwen-plus}
    smart: ${SMART_MODEL:dashscope:qwen-plus}
    strong: ${STRONG_MODEL:dashscope:qwen3-max-preview}

  profiles:
    chat:
      description: "Web 端对话模式 (test)"
      system_prompt_template: profiles/chat
      tools_allowed:
        - knowledge_search
        - time_tool
      max_steps: 50
      persistence: chat_db
      model_profile: smart
