# ============================================================
# sys_config.dev.yaml — 开发环境配置
# 启动: APP_ENV=dev make dev
# ============================================================

app:
  log_level: ${APP_LOG_LEVEL}
  port: ${APP_PORT:8553}
  auth:
    jwt_secret: ${JWT_SECRET}
    jwt_algorithm: ${JWT_ALGORITHM:HS256}
    access_token_expire_minutes: ${ACCESS_TOKEN_EXPIRE_MIN:60}
    refresh_token_expire_days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
    cookie_secure: false
    cookie_samesite: lax

middleware:
  cors:
    allow_origins: ${CORS_ALLOW_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow_credentials: true

db:
  driver: ${DB_DRIVER:mysql+aiomysql}
  host: ${DB_HOST}
  port: ${DB_PORT:3306}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  database: ${DB_DATABASE}
  echo: ${DB_ECHO}
  pool_size: 3
  max_overflow: 5
  pool_pre_ping: false # aiomysql 0.3.x ping() incompatibility with sqlalchemy pool_pre_ping

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DB:0}
  pool_size: 5

celery:
  enabled: ${CELERY_ENABLED:true}
  broker_url: ${CELERY_BROKER_URL:}
  backend_url: ${CELERY_BACKEND_URL:}

memory:
  enabled: ${MEMORY_ENABLED:true}
  summarizer:
    provider: ${MEMORY_SUMMARIZER_PROVIDER:}
    model: ${MEMORY_SUMMARIZER_MODEL:}
    history_limit: 50
    max_summary_tokens: 1500
  trigger:
    every_n_turns: ${MEMORY_TRIGGER_EVERY_N:5}

llm:
  provider: ${LLM_PROVIDER:}
  default_model: ${LLM_DEFAULT_MODEL:}
  max_retries: 3
  retry_backoff_seconds: 0.5
  budget:
    global_daily_limit_usd: ${LLM_BUDGET_GLOBAL_USD:}
    default_user_daily_limit_usd: ${LLM_BUDGET_DEFAULT_USER_USD:}
    alert_threshold: ${LLM_BUDGET_ALERT:0.8}
  providers: {}

utility_llm:
  provider: ${UTILITY_LLM_PROVIDER:}
  model: ${UTILITY_LLM_MODEL:}

ingest:
  documents_path: data/documents
  chunking:
    strategy: hierarchical
    chunk_size: 500
    chunk_overlap: 50

embedding:
  provider: mock
  providers:
    mock:
      dimension: 768

vector_store:
  provider: chroma
  providers:
    chroma:
      persist_dir: data/chroma
      collection_name: child_chunks

bm25_store:
  provider: sqlite_fts5
  providers:
    sqlite_fts5:
      db_path: data/bm25/bm25.db
      table_name: bm25_chunks
  tokenizer:
    type: jieba
    user_dict: null

reranker:
  provider: mock
  providers:
    mock: {}

retrieval:
  top_n_parent: 5
  top_m_for_rerank: 20
  recall:
    vector:
      enabled: true
      top_k: 30
    bm25:
      enabled: true
      top_k: 30
  fusion:
    strategy: rrf
    rrf_k: 60
    weighted_vector: 0.7
    weighted_bm25: 0.3
  aggregation:
    score_agg: max
  rerank:
    enabled: true

observability:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    exporter: ${TRACING_EXPORTER:none}
    service_name: forge-dev
    otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    langfuse_public_key: ${LANGFUSE_PUBLIC_KEY:}
    langfuse_secret_key: ${LANGFUSE_SECRET_KEY:}
    langfuse_host: ${LANGFUSE_HOST:https://cloud.langfuse.com}


task_execution:
  # 纯聊天只开放无文件系统/命令副作用的工具；工程文件操作走 adaptive。
  chat_tool_allowlist:
    - knowledge_search

  tool_allowlist:
    - read_file
    - write_file
    - edit_file
    - list_directory
    - glob_search
    - grep
    - shell
    - git_ops
    - http_request
    - run_tests
    - knowledge_search

  model_profiles:
    fast: ${FAST_MODEL:dashscope:qwen-plus}
    smart: ${SMART_MODEL:dashscope:qwen-plus}
    strong: ${STRONG_MODEL:dashscope:qwen3-max-preview}
  planner_model_profile: smart
  discovery_model_profile: fast

  hard_caps:
    max_agents: 8
    max_steps_per_task: 50
    max_replans: 3
    max_task_retries: 2
    max_run_duration_sec: 3600

  default_options:
    allow_write: true
    allow_parallel: true
    max_agents: 4
    writer_mode: isolated_worktree
    verifier_cmd: null
