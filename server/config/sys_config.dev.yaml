# ============================================================
# sys_config.dev.yaml — 开发环境配置
# 启动: APP_ENV=dev make dev
# ============================================================

app:
  log_level: ${APP_LOG_LEVEL}
  port: ${APP_PORT:8553}
  auth:
    jwt_secret: ${JWT_SECRET}
    jwt_algorithm: ${JWT_ALGORITHM:HS256}
    access_token_expire_minutes: ${ACCESS_TOKEN_EXPIRE_MIN:60}
    refresh_token_expire_days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
    cookie_secure: false
    cookie_samesite: lax

middleware:
  cors:
    allow_origins: ${CORS_ALLOW_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow_credentials: true

db:
  driver: ${DB_DRIVER:mysql+aiomysql}
  host: ${DB_HOST}
  port: ${DB_PORT:3306}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  database: ${DB_DATABASE}
  echo: ${DB_ECHO}
  pool_size: 3
  max_overflow: 5
  pool_pre_ping: false # aiomysql 0.3.x ping() incompatibility with sqlalchemy pool_pre_ping

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DB:0}
  pool_size: 5

celery:
  enabled: ${CELERY_ENABLED:true}
  broker_url: ${CELERY_BROKER_URL:}
  backend_url: ${CELERY_BACKEND_URL:}

memory:
  enabled: ${MEMORY_ENABLED:true}
  summarizer:
    provider: ${MEMORY_SUMMARIZER_PROVIDER:}
    model: ${MEMORY_SUMMARIZER_MODEL:}
    history_limit: 50
    max_summary_tokens: 1500
  trigger:
    every_n_turns: ${MEMORY_TRIGGER_EVERY_N:5}

# 上下文管理 (短期、会话级; 与 memory 解耦)
context:
  digest:
    enabled: ${CONTEXT_DIGEST_ENABLED:true}
    # 单条消息超此 token 上限即在读时折叠为引用占位
    per_message_token_cap: ${CONTEXT_DIGEST_CAP:8000}
    # 异步 digest 任务的最小处理阈值
    min_tokens: ${CONTEXT_DIGEST_MIN_TOKENS:8000}

llm:
  provider: ${LLM_PROVIDER:}
  default_model: ${LLM_DEFAULT_MODEL:}
  max_retries: 3
  retry_backoff_seconds: 0.5
  budget:
    global_daily_limit_usd: ${LLM_BUDGET_GLOBAL_USD:}
    default_user_daily_limit_usd: ${LLM_BUDGET_DEFAULT_USER_USD:}
    alert_threshold: ${LLM_BUDGET_ALERT:0.8}

utility_llm:
  provider: ${UTILITY_LLM_PROVIDER:}
  model: ${UTILITY_LLM_MODEL:}

ingest:
  documents_path: data/documents
  chunking:
    strategy: hierarchical
    chunk_size: 500
    chunk_overlap: 50

embedding:
  provider: mock
  providers:
    mock:
      dimension: 768

vector_store:
  provider: chroma
  providers:
    chroma:
      persist_dir: data/chroma
      collection_name: child_chunks

bm25_store:
  provider: sqlite_fts5
  providers:
    sqlite_fts5:
      db_path: data/bm25/bm25.db
      table_name: bm25_chunks
  tokenizer:
    type: jieba
    user_dict: null

reranker:
  provider: mock
  providers:
    mock: {}

retrieval:
  top_n_parent: 5
  top_m_for_rerank: 20
  recall:
    vector:
      enabled: true
      top_k: 30
    bm25:
      enabled: true
      top_k: 30
  fusion:
    strategy: rrf
    rrf_k: 60
    weighted_vector: 0.7
    weighted_bm25: 0.3
  aggregation:
    score_agg: max
  rerank:
    enabled: true

observability:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    exporter: ${TRACING_EXPORTER:none}
    service_name: forge-dev
    otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    langfuse_public_key: ${LANGFUSE_PUBLIC_KEY:}
    langfuse_secret_key: ${LANGFUSE_SECRET_KEY:}
    langfuse_host: ${LANGFUSE_HOST:https://cloud.langfuse.com}

# agent_profiles: 所有 agent_mode 的统一治理 (chat / plan_exec / workflow / ...)
agent_profiles:
  model_profiles:
    fast: ${FAST_MODEL:dashscope:qwen-plus}
    smart: ${SMART_MODEL:dashscope:qwen-plus}
    strong: ${STRONG_MODEL:dashscope:qwen3-max-preview}

  profiles:
    chat:
      description: "Web 端对话模式: 只读工具, 不可派子任务, 无 Plan Mode"
      system_prompt_template: profiles/chat
      tools_allowed:
        - knowledge_search
        - time_tool
        - read_message
      readonly_tools: []
      sub_agents_allowed: []
      plan_mode_initial: false
      max_steps: 50
      persistence: chat_db
      model_profile: smart

    plan_exec:
      description: "CLI 任务模式 (Claude Code 风格 Plan-Exec): Plan 阶段只读 + exit_plan_mode, 批准后解锁写工具"
      system_prompt_template: profiles/plan_exec
      tools_allowed:
        - read_file
        - list_directory
        - glob_search
        - grep
        - knowledge_search
        - time_tool
        - write_file
        - edit_file
        - shell
        - git_ops
        - http_request
        - exit_plan_mode
        - create_artifact
        - get_artifact
        - search_artifact
        - spawn_subagent
      readonly_tools:
        - read_file
        - list_directory
        - glob_search
        - grep
        - knowledge_search
        - time_tool
        - get_artifact
        - search_artifact
        - exit_plan_mode
      sub_agents_allowed:
        - developer
        - architect
        - reviewer
        - qa
      plan_mode_initial: true
      max_steps: 80
      persistence: run_store
      model_profile: smart
      large_artifact_threshold_bytes: 8192

    workflow:
      description: "CLI 工作流模式: YAML 模板驱动 phase 流水线, 命中 gate 走 HITL"
      system_prompt_template: profiles/workflow
      tools_allowed:
        - read_file
        - write_file
        - edit_file
        - list_directory
        - glob_search
        - grep
        - shell
        - knowledge_search
        - time_tool
        - advance_phase
        - create_artifact
        - get_artifact
        - search_artifact
        - spawn_subagent
      readonly_tools: []
      sub_agents_allowed:
        - developer
        - architect
        - reviewer
        - qa
        - devops
      plan_mode_initial: false
      max_steps: 100
      persistence: run_store
      requires_template: true
      model_profile: smart
      large_artifact_threshold_bytes: 8192
