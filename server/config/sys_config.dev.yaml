# ============================================================
# sys_config.dev.yaml — 开发环境配置
# 启动: APP_ENV=dev make dev
# ============================================================

app:
  log_level: ${APP_LOG_LEVEL}
  port: ${APP_PORT:8553}
  auth:
    jwt_secret: ${JWT_SECRET}
    jwt_algorithm: ${JWT_ALGORITHM:HS256}
    access_token_expire_minutes: ${ACCESS_TOKEN_EXPIRE_MIN:60}
    refresh_token_expire_days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
    cookie_secure: false
    cookie_samesite: lax

middleware:
  cors:
    allow_origins: ${CORS_ALLOW_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow_credentials: true

db:
  driver: ${DB_DRIVER:mysql+aiomysql}
  host: ${DB_HOST}
  port: ${DB_PORT:3306}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  database: ${DB_DATABASE}
  echo: ${DB_ECHO}
  pool_size: 3
  max_overflow: 5
  pool_pre_ping: false # aiomysql 0.3.x ping() incompatibility with sqlalchemy pool_pre_ping

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DB:0}
  pool_size: 5

celery:
  enabled: ${CELERY_ENABLED:true}
  broker_url: ${CELERY_BROKER_URL:}
  backend_url: ${CELERY_BACKEND_URL:}

memory:
  enabled: ${MEMORY_ENABLED:true}
  summarizer:
    provider: ${MEMORY_SUMMARIZER_PROVIDER:}
    model: ${MEMORY_SUMMARIZER_MODEL:}
    history_limit: 50
    max_summary_tokens: 1500
  trigger:
    every_n_turns: ${MEMORY_TRIGGER_EVERY_N:5}
  # 用户长期事实层 (跨会话记忆): LLM 抽取 + 语义召回; 代码默认关, dev 显式开
  facts:
    enabled: ${MEMORY_FACTS_ENABLED:true}
    extract_every_n_turns: ${MEMORY_FACTS_EXTRACT_EVERY_N:5}
    top_k: 5
    min_score: 0.5
    dedup_threshold: 0.92
    max_facts_per_turn: 10
    provider: ${MEMORY_FACTS_PROVIDER:}
    model: ${MEMORY_FACTS_MODEL:}

# 上下文管理 (短期、会话级; 与 memory 解耦)
context:
  digest:
    enabled: ${CONTEXT_DIGEST_ENABLED:true}
    # 单条消息超此 token 上限即在读时折叠为引用占位
    per_message_token_cap: ${CONTEXT_DIGEST_CAP:6000}
    # 异步 digest 任务的最小处理阈值
    min_tokens: ${CONTEXT_DIGEST_MIN_TOKENS:6000}
  # 语义历史召回 (默认关; 开启需配置 embedding provider, 每轮多一次 query embedding)
  semantic_recall:
    enabled: ${CONTEXT_SEMANTIC_RECALL_ENABLED:false}
    # 早期轮次保留的相似度阈值 (低于此分整轮剔除)
    min_score: ${CONTEXT_SEMANTIC_MIN_SCORE:0.6}
    # 最近多少轮无条件保留 (保证对话连贯)
    anchor_turns: ${CONTEXT_SEMANTIC_ANCHOR_TURNS:3}
    # 冷路径每次为多少条近期消息补算 embedding
    scan_limit: 50
    # 冷路径补算后按此上限淘汰更早的向量
    retain_turns: 50

llm:
  provider: ${LLM_PROVIDER:}
  default_model: ${LLM_DEFAULT_MODEL:}
  max_retries: 3
  retry_backoff_seconds: 0.5
  budget:
    global_daily_limit_usd: ${LLM_BUDGET_GLOBAL_USD:}
    default_user_daily_limit_usd: ${LLM_BUDGET_DEFAULT_USER_USD:}
    alert_threshold: ${LLM_BUDGET_ALERT:0.8}

utility_llm:
  provider: ${UTILITY_LLM_PROVIDER:}
  model: ${UTILITY_LLM_MODEL:}

ingest:
  documents_path: data/documents
  chunking:
    strategy: hierarchical
    chunk_size: 500
    chunk_overlap: 50

vector_store:
  provider: chroma
  providers:
    chroma:
      persist_dir: data/chroma
      collection_name: child_chunks

bm25_store:
  provider: sqlite_fts5
  providers:
    sqlite_fts5:
      db_path: data/bm25/bm25.db
      table_name: bm25_chunks
  tokenizer:
    type: jieba
    user_dict: null

retrieval:
  top_n_parent: 5
  top_m_for_rerank: 20
  recall:
    vector:
      enabled: true
      top_k: 30
    bm25:
      enabled: true
      top_k: 30
  fusion:
    strategy: rrf
    rrf_k: 60
    weighted_vector: 0.7
    weighted_bm25: 0.3
  aggregation:
    score_agg: max
  rerank:
    enabled: true

observability:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    exporter: ${TRACING_EXPORTER:none}
    service_name: forge-dev
    otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    langfuse_public_key: ${LANGFUSE_PUBLIC_KEY:}
    langfuse_secret_key: ${LANGFUSE_SECRET_KEY:}
    langfuse_host: ${LANGFUSE_HOST:https://cloud.langfuse.com}

# agent_profiles: 所有 agent_mode 的统一治理 (当前仅 chat)
agent_profiles:
  model_profiles:
    fast: ${FAST_MODEL:dashscope:qwen-plus}
    smart: ${SMART_MODEL:dashscope:qwen-plus}
    strong: ${STRONG_MODEL:dashscope:qwen3-max-preview}

  profiles:
    chat:
      description: "Web 端对话模式: 只读工具, 不可派子任务"
      system_prompt_template: profiles/chat
      tools_allowed:
        - knowledge_search
        - time_tool
        - read_message
      max_steps: 999
      model_profile: smart
