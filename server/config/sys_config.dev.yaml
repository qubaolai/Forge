# ============================================================
# sys_config.dev.yaml — 开发环境配置
# 启动: APP_ENV=dev make dev
# ============================================================

deployment_mode: ${DEPLOYMENT_MODE:local}

app:
  log_level: ${APP_LOG_LEVEL}
  port: ${APP_PORT:8553}
  user_cache_ttl_seconds: ${USER_CACHE_TTL:259200}
  auth:
    jwt_secret: ${JWT_SECRET}
    jwt_algorithm: ${JWT_ALGORITHM:HS256}
    access_token_expire_minutes: ${ACCESS_TOKEN_EXPIRE_MIN:60}
    refresh_token_expire_days: ${REFRESH_TOKEN_EXPIRE_DAYS:30}
    cookie_secure: false
    cookie_samesite: lax

middleware:
  cors:
    allow_origins: ${CORS_ALLOW_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow_credentials: true
  rate_limit:
    enabled: false
    default_per_minute: 600

db:
  driver: ${DB_DRIVER:mysql+aiomysql}
  host: ${DB_HOST}
  port: ${DB_PORT:3306}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  database: ${DB_DATABASE}
  echo: ${DB_ECHO}
  charset: utf8mb4
  pool_size: 3
  max_overflow: 5
  pool_recycle: 3600
  pool_pre_ping: false # aiomysql 0.3.x ping() incompatibility with sqlalchemy pool_pre_ping

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DB:0}
  pool_size: 5

celery:
  enabled: ${CELERY_ENABLED:true}
  broker_url: ${CELERY_BROKER_URL:}
  backend_url: ${CELERY_BACKEND_URL:}

user_quota:
  enabled: true
  alert_threshold: 0.8
  five_hour:
    window_seconds: 18000
    limit_usd:
    limit_tokens:
    limit_calls:
  weekly:
    window_seconds: 604800
    limit_usd:
    limit_tokens:
    limit_calls:


memory:
  enabled: ${MEMORY_ENABLED:true}
  summarizer:
    provider: ${MEMORY_SUMMARIZER_PROVIDER:}
    model: ${MEMORY_SUMMARIZER_MODEL:}
    history_limit: 50
    max_summary_tokens: 1500
  trigger:
    every_n_turns: ${MEMORY_TRIGGER_EVERY_N:5}

llm:
  provider: ${LLM_DEFAULT_PROVIDER:dashscope}
  default_model: ${LLM_DEFAULT_MODEL:qwen-plus}
  fallback_chain: ${LLM_FALLBACK_CHAIN:}
  max_retries: 2
  retry_backoff_seconds: 0.5

  # dev 默认不开预算 (调试不阻断); 通过 env 临时启用即可
  budget:
    global_daily_limit_usd: ${LLM_BUDGET_GLOBAL_USD:}
    default_user_daily_limit_usd: ${LLM_BUDGET_DEFAULT_USER_USD:}
    alert_threshold: ${LLM_BUDGET_ALERT:0.8}

  providers:
    dashscope:
      api_keys:
      - ${DASHSCOPE_API_KEY}
      - ${DASHSCOPE_API_KEY_2:}
      key_strategy: round_robin
      timeout: 30
      models:
      - name: qwen3-max-preview
        display_name: 通义千问 Max
        context_window: 32768
      - name: qwen3.6-plus
        display_name: 通义千问 qwen3.6-plus
        context_window: 131072
      - name: qwen3.5-flash
        display_name: 通义千问 qwen3.5-flash
        context_window: 131072
      - name: qwen3.5-27b
        display_name: 通义千问 qwen3.5-27b
        context_window: 131072
      - name: qwen3.7-max
        display_name: 通义千问 qwen3.7-max
        context_window: 131072
      - name: qwen3.6-27b
        display_name: 通义千问 qwen3.6-27b
        context_window: 131072
      default_params:
        temperature: 0.7

    openai:
      api_keys:
      - ${OPENAI_API_KEY:}
      timeout: 30
      models:
      - name: gpt-4o
        display_name: GPT-4o
        context_window: 128000
      - name: gpt-4o-mini
        display_name: GPT-4o mini
        context_window: 128000
      default_params:
        temperature: 0.7

    deepseek:
      api_keys:
      - ${DEEPSEEK_API_KEY:}
      timeout: 30
      models:
      - name: deepseek-v4-pro
        display_name: DeepSeek V4 PRO
        context_window: 1000000
        reasoning_effort: high
      - name: deepseek-v4-flash
        display_name: DeepSeek V4 flash
        context_window: 1000000
        reasoning_effort: high
      default_params:
        temperature: 0.7
        thinking: ${DEEPSEEK_THINKING_DEFAULT:true}

    anthropic:
      api_keys:
      - ${ANTHROPIC_API_KEY:}
      timeout: 30
      models:
      - name: claude-sonnet-4-5
        display_name: Claude Sonnet 4.5
        context_window: 200000
      - name: claude-haiku-4-5
        display_name: Claude Haiku 4.5
        context_window: 200000
      default_params:
        temperature: 1.0
        max_tokens: 4096

utility_llm:
  provider: ${UTILITY_LLM_PROVIDER:dashscope}
  model: ${UTILITY_LLM_MODEL:qwen3.5-flash}

ingest:
  documents_path: data/documents
  chunking:
    strategy: hierarchical
    chunk_size: 500
    chunk_overlap: 50

embedding:
  provider: ${EMBEDDING_PROVIDER:dashscope}
  providers:
    dashscope:
      api_key: ${DASHSCOPE_API_KEY}
      model: tongyi-embedding-vision-plus-2026-03-06
      dimension: 1024
      batch_size: 10
      max_retries: 3
      retry_backoff: 1.0
    bge_local:
      model_path: BAAI/bge-m3
      device: cpu
    mock:
      dimension: 768

vector_store:
  provider: chroma
  providers:
    chroma:
      persist_dir: data/chroma
      collection_name: child_chunks

bm25_store:
  provider: sqlite_fts5
  providers:
    sqlite_fts5:
      db_path: data/bm25/bm25.db
      table_name: bm25_chunks
  tokenizer:
    type: jieba
    user_dict: null

reranker:
  provider: ${RERANKER_PROVIDER:dashscope}
  providers:
    dashscope:
      api_key: ${DASHSCOPE_API_KEY}
      model: gte-rerank
      timeout: 5.0
      truncation:
        strategy: tail
        max_doc_chars: 4000
        monitor_threshold: 0.1
    bge_local:
      model_path: BAAI/bge-reranker-v2-m3
      device: cpu
      truncation:
        strategy: tail
        max_doc_chars: 4000
        monitor_threshold: 0.1
    mock: {}

retrieval:
  top_n_parent: 5
  top_m_for_rerank: 20
  recall:
    vector:
      enabled: true
      top_k: 30
    bm25:
      enabled: true
      top_k: 30
  fusion:
    strategy: rrf
    rrf_k: 60
    weighted_vector: 0.7
    weighted_bm25: 0.3
  aggregation:
    score_agg: max
  rerank:
    enabled: true

observability:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    exporter: ${TRACING_EXPORTER:none}
    service_name: forge-dev
    otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    langfuse_public_key: ${LANGFUSE_PUBLIC_KEY:}
    langfuse_secret_key: ${LANGFUSE_SECRET_KEY:}
    langfuse_host: ${LANGFUSE_HOST:https://cloud.langfuse.com}

# Forge Adaptive Task Execution
task_execution:
  # 纯聊天只开放无文件系统/命令副作用的工具；工程文件操作走 adaptive。
  chat_tool_allowlist:
    - knowledge_search

  tool_allowlist:
    - read_file
    - write_file
    - edit_file
    - list_directory
    - glob_search
    - grep
    - shell
    - git_ops
    - http_request
    - run_tests
    - knowledge_search

  model_profiles:
    fast: ${FAST_MODEL}
    smart: ${SMART_MODEL}
    strong: ${STRONG_MODEL}
  mode_router_model_profile: fast
  planner_model_profile: smart
  discovery_model_profile: fast

  hard_caps:
    max_agents: 8
    max_steps_per_task: 50
    max_replans: 3
    max_task_retries: 2
    max_run_duration_sec: 3600

  default_options:
    allow_write: true
    allow_parallel: true
    max_agents: 4
    writer_mode: isolated_worktree
    verifier_cmd: null
