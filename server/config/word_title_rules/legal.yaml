# 法律/合同条款规则集
# 适用: 合同/法规/条例等使用 "第X条/第X款/第X项" 编号的文档

rules:
  # 一级: 第N条
  - name: legal_article
    pattern: '^第[一二三四五六七八九十百千\d]+条[\s、.,]*\S'
    level: 1
    specificity: 18
    priority: 5
    require_bold: prefer
    max_length: 40

  # 二级: 第N款
  - name: legal_clause
    pattern: '^第[一二三四五六七八九十百千\d]+款[\s、.,]*\S'
    level: 2
    specificity: 22
    require_bold: prefer
    max_length: 40

  # 三级: 第N项
  - name: legal_item
    pattern: '^第[一二三四五六七八九十百千\d]+项[\s、.,]*\S'
    level: 3
    specificity: 26
    require_bold: prefer
    max_length: 50

excludes:
  # 引用: "依照第三条规定"
  - name: cross_ref_legal
    pattern: '(依照|根据|依据|按照|参照)\s*第[一二三四五六七八九十百千\d]+[条款项]'

forbidden_endings: ['。', '；', '，', ';', ',', '：', ':']
global_max_length: 80
score_threshold: 0.8
title_size_ratio: 1.15