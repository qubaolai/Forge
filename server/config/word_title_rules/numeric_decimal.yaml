# 阿拉伯数字层级编号规则集
# 适用: 接口文档/技术规范/产品需求等使用 1./1.1/1.1.1 形式编号的文档

rules:
  # ============================================================
  # 严格版规则: 编号与正文之间有明确分隔符 (空格/Tab/全角空格)
  # 置信度高, require_bold=prefer 即可
  # ============================================================

  # 四级: 1.1.1.1 + 分隔
  - name: decimal_h4
    pattern: '^\d+\.\d+\.\d+\.\d+\s+\S'
    level: 4
    specificity: 40
    require_bold: prefer
    max_length: 80

  # 三级: 1.1.1 + 分隔
  - name: decimal_h3
    pattern: '^\d+\.\d+\.\d+\s+\S'
    level: 3
    specificity: 30
    require_bold: prefer
    max_length: 70

  # 二级: 1.1 + 分隔
  - name: decimal_h2
    pattern: '^\d+\.\d+\s+\S'
    level: 2
    specificity: 20
    require_bold: prefer
    max_length: 60

  # 一级: 1. + 分隔  (要求点后有空格,避免误匹配 "1.是" 这种选项)
  - name: decimal_h1
    pattern: '^\d+\.\s+\S'
    level: 1
    specificity: 10
    require_bold: prefer
    max_length: 50

  # ============================================================
  # 宽松版规则: 无分隔符 (如 "2.1合同") 或仅以中文标点跟随
  # 用 (?!\d) 避免吃掉 "2.1 分" 这种带小数的正文
  # require_bold=strict, 提高精度防止误判
  # specificity 比严格版低 1, 让严格版优先匹配
  # ============================================================

  - name: decimal_h4_loose
    pattern: '^\d+\.\d+\.\d+\.\d+(?!\d)\S'
    level: 4
    specificity: 39
    require_bold: strict
    max_length: 80

  - name: decimal_h3_loose
    pattern: '^\d+\.\d+\.\d+(?!\d)\S'
    level: 3
    specificity: 29
    require_bold: strict
    max_length: 70

  - name: decimal_h2_loose
    pattern: '^\d+\.\d+(?!\d)\S'
    level: 2
    specificity: 19
    require_bold: strict
    max_length: 60

  # 一级宽松版危险性较高 (容易误吃 "1.是" "1.否")
  # 所以仍然要求加粗 + 不能跟数字
  - name: decimal_h1_loose
    pattern: '^\d+\.(?!\d)\S'
    level: 1
    specificity: 9
    require_bold: strict
    max_length: 50

  # ============================================================
  # 章节: 第N章
  # ============================================================
  - name: chapter_h1
    pattern: '^第[\d一二三四五六七八九十百千]+章\s*\S'
    level: 1
    specificity: 15
    priority: 5
    require_bold: prefer
    max_length: 40

  # ============================================================
  # 阿拉伯数字 + 中文顿号: "1、" "2、" "10、"
  # 适用: 中文野生文档常见, 例如 "1、关于向量"、"2、加密算法"
  # 用 (?!\d) 避免把 "1.5、" 这种小数误吃
  # ============================================================
  - name: arabic_dot_h1
    pattern: '^\d+(?!\d)\s*、\s*\S'
    level: 1
    specificity: 11
    priority: 3
    require_bold: prefer
    max_length: 50

excludes:
  # 跨节引用: "详见 1.2 节" / "见 3.1.2"
  - name: cross_ref_section
    pattern: '(详见|参见|见|参考)\s*\d+(\.\d+)*\s*[节章条款]?'

  # 选项: 同一行多个 "1.是 2.否" 这种
  - name: yes_no_option
    pattern: '^\d+\.\s*(是|否|YES|NO|Y|N)(\s+\d+\.\s*(是|否|YES|NO|Y|N))*\s*$'

forbidden_endings: ['。', '；', '，', ';', ',', '：', ':']
global_max_length: 100
score_threshold: 0.8
title_size_ratio: 1.15